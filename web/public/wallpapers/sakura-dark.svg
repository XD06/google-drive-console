<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1030"/>
      <stop offset="0.5" stop-color="#1c0f33"/>
      <stop offset="1" stop-color="#0d0a20"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d64f8f" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#d64f8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4a63d8" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#4a63d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9a4fd6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a4fd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d6874f" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#d6874f" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05" intercept="0"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <ellipse cx="1250" cy="230" rx="700" ry="540" fill="url(#g1)"/>
  <ellipse cx="280" cy="800" rx="660" ry="520" fill="url(#g2)"/>
  <ellipse cx="430" cy="190" rx="560" ry="440" fill="url(#g3)"/>
  <ellipse cx="1380" cy="870" rx="520" ry="420" fill="url(#g4)"/>
  <rect width="1600" height="1000" filter="url(#noise)"/>
</svg>
