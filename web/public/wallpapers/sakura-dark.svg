<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1220"/>
      <stop offset="0.55" stop-color="#161222"/>
      <stop offset="1" stop-color="#121324"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a44a77" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#a44a77" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a4fb0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3a4fb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a48b4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7a48b4" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.025" intercept="0"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <ellipse cx="1420" cy="140" rx="880" ry="660" fill="url(#g1)"/>
  <ellipse cx="160" cy="880" rx="860" ry="640" fill="url(#g2)"/>
  <ellipse cx="1380" cy="940" rx="660" ry="480" fill="url(#g3)"/>
  <rect width="1600" height="1000" filter="url(#noise)"/>
</svg>
