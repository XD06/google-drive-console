<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111527"/>
      <stop offset="0.55" stop-color="#121422"/>
      <stop offset="1" stop-color="#15121f"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3653b8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3653b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6b46c4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6b46c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a8f96" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2a8f96" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.025" intercept="0"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <ellipse cx="180" cy="120" rx="820" ry="620" fill="url(#g1)"/>
  <ellipse cx="1480" cy="900" rx="780" ry="600" fill="url(#g2)"/>
  <ellipse cx="220" cy="960" rx="620" ry="440" fill="url(#g3)"/>
  <rect width="1600" height="1000" filter="url(#noise)"/>
</svg>
