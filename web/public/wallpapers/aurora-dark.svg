<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101636"/>
      <stop offset="0.5" stop-color="#170f38"/>
      <stop offset="1" stop-color="#090b1e"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b74e8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3b74e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4419f" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#c4419f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6e50e0" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#6e50e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1fb3ba" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1fb3ba" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e86a8a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e86a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
