      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05" intercept="0"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <ellipse cx="330" cy="250" rx="660" ry="520" fill="url(#g1)"/>
  <ellipse cx="1330" cy="160" rx="560" ry="440" fill="url(#g2)"/>
  <ellipse cx="850" cy="660" rx="640" ry="520" fill="url(#g3)"/>
  <ellipse cx="220" cy="880" rx="540" ry="430" fill="url(#g4)"/>
  <ellipse cx="1440" cy="850" rx="520" ry="440" fill="url(#g5)"/>
  <rect width="1600" height="1000" filter="url(#noise)"/>
