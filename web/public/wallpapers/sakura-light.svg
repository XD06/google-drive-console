<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf5f7"/>
      <stop offset="0.55" stop-color="#faf3f9"/>
      <stop offset="1" stop-color="#f3f5fc"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f9c2d8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f9c2d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bfd0f8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#bfd0f8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ecd2f4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ecd2f4" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.02" intercept="0"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <ellipse cx="1420" cy="140" rx="800" ry="600" fill="url(#g1)"/>
  <ellipse cx="160" cy="880" rx="780" ry="580" fill="url(#g2)"/>
  <ellipse cx="1380" cy="940" rx="600" ry="440" fill="url(#g3)"/>
  <rect width="1600" height="1000" filter="url(#noise)"/>
</svg>
