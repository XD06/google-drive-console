<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fae0e9"/>
      <stop offset="0.55" stop-color="#f3ddf0"/>
      <stop offset="1" stop-color="#e2e6f9"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6b1cf" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f6b1cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#adc2f6" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#adc2f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e3c3f0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#e3c3f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.02" intercept="0"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <ellipse cx="1420" cy="140" rx="880" ry="660" fill="url(#g1)"/>
  <ellipse cx="160" cy="880" rx="860" ry="640" fill="url(#g2)"/>
  <ellipse cx="1380" cy="940" rx="660" ry="480" fill="url(#g3)"/>
  <rect width="1600" height="1000" filter="url(#noise)"/>
</svg>
