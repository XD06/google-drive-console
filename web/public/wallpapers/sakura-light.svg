<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe3ec"/>
      <stop offset="0.5" stop-color="#f6ddf3"/>
      <stop offset="1" stop-color="#dfe7fb"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9ec4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9ec4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9db8ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9db8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8b3ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e8b3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04" intercept="0"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <ellipse cx="1250" cy="220" rx="700" ry="540" fill="url(#g1)"/>
  <ellipse cx="280" cy="800" rx="660" ry="520" fill="url(#g2)"/>
  <ellipse cx="420" cy="180" rx="560" ry="440" fill="url(#g3)"/>
  <ellipse cx="1380" cy="860" rx="520" ry="420" fill="url(#g4)"/>
  <ellipse cx="820" cy="500" rx="480" ry="380" fill="url(#g5)"/>
  <rect width="1600" height="1000" filter="url(#noise)"/>
</svg>
