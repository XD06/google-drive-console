<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Personal Google Drive backup console" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Drive Backup" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Drive Backup Console</title>
    <script>
      // Paint the wallpaper/theme before React mounts — without this the
      // first frames show the bare body gradient (flash on every reload).
      // Values mirror useWallpaper.ts / useTheme.ts; the hooks stay idempotent.
      (function () {
        try {
          var m = document.documentElement;
          var w = JSON.parse(localStorage.getItem("dbc.wallpaper") || '"photo"');
          m.setAttribute("data-wallpaper", String(w));
          var t = JSON.parse(localStorage.getItem("dbc.theme") || '"auto"');
          var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          m.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) { /* private mode etc. — hooks will set defaults later */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
